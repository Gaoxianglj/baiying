<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白璎控制台</title>
<style>
  :root {
    --bg: #faf9ff;
    --panel: #ffffff;
    --ink: #241f36;
    --muted: #6f6a86;
    --faint: #9a95b0;
    --line: #ece8f8;
    --violet-50: #f6f2ff;
    --violet-100: #ede5ff;
    --violet-200: #dccdfe;
    --violet-300: #c4abfc;
    --violet-400: #a47ff7;
    --violet-500: #8b5cf6;
    --violet-600: #7442e6;
    --violet-700: #6030c9;
    --green: #12a37a;
    --amber: #d98a06;
    --rose: #e0446a;
    --shadow: 0 1px 2px rgba(60, 30, 120, .04), 0 8px 24px rgba(90, 50, 180, .07);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 18px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 600; color: #fff;
    background: radial-gradient(circle at 30% 25%, #e9ddff 0, #b897fb 35%, #7442e6 100%);
    box-shadow: 0 6px 16px rgba(116, 66, 230, .35), inset 0 0 0 2px rgba(255,255,255,.5);
    flex: none;
  }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .brand p { margin: 0; font-size: 12px; color: var(--faint); }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button {
    display: flex; align-items: center; gap: 12px;
    border: 0; background: none; cursor: pointer;
    padding: 10px 14px; border-radius: 12px;
    color: var(--muted); text-align: left; font-size: 14px;
    transition: background .15s, color .15s;
  }
  nav button:hover { background: var(--violet-50); color: var(--violet-700); }
  nav button.active { background: var(--violet-100); color: var(--violet-700); font-weight: 600; }
  nav svg { width: 18px; height: 18px; flex: none; }
  .aside-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 10px; }

  main { padding: 36px 44px 120px; max-width: 1180px; width: 100%; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .page-head h2 { font-size: 24px; margin: 0; letter-spacing: .01em; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }

  /* ---------- 通用组件 ---------- */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; gap: 18px; }
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); }
  .dot.on { background: var(--green); box-shadow: 0 0 0 4px rgba(18,163,122,.12); }
  .dot.off { background: var(--rose); box-shadow: 0 0 0 4px rgba(224,68,106,.1); }
  .btn {
    border: 1px solid var(--violet-200); background: #fff; color: var(--violet-700);
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { background: var(--violet-50); border-color: var(--violet-300); }
  .btn.primary {
    background: linear-gradient(135deg, var(--violet-500), var(--violet-600));
    border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(116,66,230,.28);
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--rose); border-color: #f5c8d4; }
  .btn.danger:hover { background: #fff3f6; }
  .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 1px 9px; border-radius: 999px;
    background: var(--violet-50); color: var(--violet-700); border: 1px solid var(--violet-100);
    white-space: nowrap;
  }
  .chip.green { background: #ebf9f4; color: var(--green); border-color: #cdeee2; }
  .chip.amber { background: #fff6e6; color: var(--amber); border-color: #f8e2b5; }
  .chip.grey { background: #f4f3f8; color: var(--muted); border-color: #e8e6ef; }
  .bar { height: 8px; background: var(--violet-50); border-radius: 999px; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--violet-300), var(--violet-600));
    transition: width .6s ease;
  }
  .bar.warn > i { background: linear-gradient(90deg, #f7c46c, var(--amber)); }
  .bar.full > i { background: linear-gradient(90deg, #f39ab0, var(--rose)); }
  .empty { text-align: center; color: var(--faint); padding: 36px 0; }

  /* ---------- 概览 ---------- */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 20px; padding: 28px 30px; margin-bottom: 20px;
    background: linear-gradient(120deg, #7442e6 0%, #9a6cf8 55%, #c9b2ff 100%);
    color: #fff; box-shadow: 0 14px 34px rgba(116,66,230,.28);
  }
  .hero::after {
    content: ""; position: absolute; right: -60px; top: -80px; width: 280px; height: 280px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
  }
  .hero h2 { margin: 0; font-size: 26px; }
  .hero p { margin: 6px 0 0; opacity: .9; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 6px; }
  .stat b { display: block; font-size: 24px; font-weight: 650; color: var(--violet-700); line-height: 1.3; }
  .stat span { font-size: 12px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; }
  .quota { margin-bottom: 12px; }
  .quota .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }

  /* ---------- 设置 ---------- */
  .section-card { margin-bottom: 18px; padding: 6px 22px; }
  .section-card > h3 { padding: 14px 0 6px; margin: 0; }
  .field {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: center;
    padding: 14px 0; border-top: 1px solid var(--line);
  }
  .section-card > h3 + .field { border-top: 0; }
  .field .label { font-weight: 550; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .field .help { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .field .control { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
  .field.dirty { background: linear-gradient(90deg, var(--violet-50), transparent 70%); margin: 0 -22px; padding: 14px 22px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--line); background: #fdfcff;
    border-radius: 10px; padding: 8px 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--violet-400); box-shadow: 0 0 0 4px var(--violet-100); }
  input:disabled, select:disabled { background: #f6f5fa; color: var(--faint); }
  .unit { color: var(--muted); white-space: nowrap; font-size: 13px; }
  .num-wrap { display: flex; align-items: center; gap: 8px; width: 100%; }
  .num-wrap input { max-width: 140px; margin-left: auto; }
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: #dcd8e8; cursor: pointer; transition: .2s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .2s;
  }
  .switch input:checked + span { background: var(--violet-500); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .switch input:disabled + span { opacity: .5; cursor: default; }
  .slider-wrap { display: flex; align-items: center; gap: 12px; width: 100%; }
  input[type=range] { flex: 1; accent-color: var(--violet-500); height: 4px; }
  .slider-val {
    min-width: 54px; text-align: center; font-variant-numeric: tabular-nums;
    background: var(--violet-50); color: var(--violet-700); border-radius: 8px; padding: 2px 8px; font-weight: 600;
  }
  .link { color: var(--violet-600); cursor: pointer; font-size: 12px; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration: underline; }
  .savebar {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, calc(100% + 40px));
    visibility: hidden;
    background: #2a2340; color: #fff; border-radius: 14px; padding: 10px 12px 10px 20px;
    display: flex; align-items: center; gap: 14px; box-shadow: 0 12px 34px rgba(30,20,60,.35);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2); z-index: 20;
  }
  .savebar.show { transform: translate(-50%, 0); visibility: visible; }
  .savebar .btn { border-color: rgba(255,255,255,.25); background: transparent; color: #fff; }
  .savebar .btn.primary { background: linear-gradient(135deg, var(--violet-400), var(--violet-600)); }

  /* ---------- 白璎 ---------- */
  textarea.seed {
    min-height: 460px; resize: vertical; line-height: 1.75; padding: 14px 16px;
    font-family: "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; font-size: 13px;
  }
  .md h1 { font-size: 18px; margin: 0 0 8px; }
  .md h2 { font-size: 14px; margin: 16px 0 6px; color: var(--violet-700); }
  .md ul { margin: 0; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md blockquote { margin: 0 0 10px; padding: 6px 12px; border-left: 3px solid var(--violet-200); color: var(--muted); background: var(--violet-50); border-radius: 0 8px 8px 0; }
  .md p { margin: 6px 0; }
  .md .src { color: var(--faint); font-size: 11px; }

  /* ---------- 人物 ---------- */
  .people { display: grid; grid-template-columns: 280px 1fr; gap: 18px; align-items: start; }
  .plist { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 24px; }
  .pitem {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; transition: .15s; text-align: left;
  }
  .pitem:hover { border-color: var(--violet-200); }
  .pitem.active { border-color: var(--violet-400); background: var(--violet-50); box-shadow: 0 0 0 3px var(--violet-100); }
  .pav {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--violet-100); color: var(--violet-700); font-weight: 600;
  }
  .pitem .meta { font-size: 12px; color: var(--faint); }
  .memo { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  .memo:first-of-type { border-top: 0; }
  .memo .body { flex: 1; }
  .memo .when { font-size: 12px; color: var(--faint); margin-top: 2px; display: flex; gap: 8px; align-items: center; }

  /* ---------- 今天 ---------- */
  .slots { display: flex; flex-direction: column; }
  .slot { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .slot:first-child { border-top: 0; }
  .slot b { color: var(--muted); font-weight: 550; font-size: 13px; }
  .slot.now { background: linear-gradient(90deg, var(--violet-50), transparent 80%); margin: 0 -22px; padding: 9px 22px; }
  .slot.now b { color: var(--violet-700); }
  .slot.later { color: var(--faint); }
  .mood-word { font-size: 22px; font-weight: 650; color: var(--violet-700); }
  .timeline .memo .body { white-space: pre-wrap; }

  /* ---------- 日记 ---------- */
  .journal { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
  .jitem { padding: 10px 14px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; }
  .jitem:hover { background: var(--violet-50); }
  .jitem.active { background: var(--violet-100); border-color: var(--violet-200); }
  .jitem b { display: block; font-size: 13px; }
  .jitem span { font-size: 12px; color: var(--faint); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .paper {
    background: #fff; border-radius: 18px; padding: 34px 40px; border: 1px solid var(--line); box-shadow: var(--shadow);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif; font-size: 16px; line-height: 2;
    border-left: 4px solid var(--violet-200);
  }
  .persona-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
  .paper h3 { font-family: inherit; color: var(--violet-700); margin: 0 0 10px; }

  /* ---------- 表情包 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filters button {
    border: 1px solid var(--violet-100); background: #fff; color: var(--muted);
    padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; transition: .15s;
  }
  .filters button:hover { border-color: var(--violet-300); color: var(--violet-700); }
  .filters button.on { background: var(--violet-500); border-color: var(--violet-500); color: #fff; }
  .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 16px; }
  .sticker {
    position: relative; background: #fff; border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
  }
  .sticker:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(90,50,180,.14); }
  .sticker .pic {
    aspect-ratio: 1 / 1; display: grid; place-items: center;
    background: repeating-conic-gradient(var(--violet-50) 0 25%, #fff 0 50%) 0 0 / 18px 18px;
  }
  .sticker img { max-width: 88%; max-height: 88%; object-fit: contain; border-radius: 8px; }
  .sticker .info { padding: 10px 12px 12px; }
  .sticker .desc {
    font-size: 12.5px; color: var(--muted); margin-top: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sticker .counts { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .sticker .del {
    position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s;
    background: rgba(255,255,255,.95);
  }
  .sticker:hover .del { opacity: 1; }

  /* ---------- 弹窗与提示 ---------- */
  .toast {
    position: fixed; top: 22px; left: 50%; transform: translate(-50%, -12px);
    background: #fff; border: 1px solid var(--violet-200); color: var(--ink);
    border-radius: 12px; padding: 10px 18px; box-shadow: var(--shadow); z-index: 40;
    display: flex; gap: 8px; align-items: center;
    opacity: 0; visibility: hidden; transition: opacity .25s, transform .25s, visibility .25s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  .toast.err { border-color: #f5c8d4; }
  .modal-back { position: fixed; inset: 0; background: rgba(36,31,54,.35); display: none; place-items: center; z-index: 30; backdrop-filter: blur(2px); }
  .modal-back.show { display: grid; }
  .modal { background: #fff; border-radius: 18px; padding: 24px; width: min(440px, 92vw); box-shadow: 0 24px 60px rgba(40,20,90,.3); }
  .modal h3 { margin: 0 0 8px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  @media (max-width: 920px) {
    .app { grid-template-columns: 1fr; }
    aside {
      position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; flex-wrap: wrap;
      align-items: center; padding: 10px 14px; gap: 10px 18px;
    }
    .avatar { width: 36px; height: 36px; font-size: 16px; }
    .brand p { display: none; }
    nav { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px; }
    nav button { padding: 7px 10px; }
    .aside-foot { display: none; }
    main { padding: 20px 16px 120px; }
    .grid.cols-2, .grid.cols-3, .people, .journal, .persona-grid { grid-template-columns: 1fr; }
    .field { grid-template-columns: 1fr; gap: 8px; }
    .field .control { justify-content: flex-start; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .plist { position: static; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="avatar" id="brandAvatar">璎</div>
      <div><h1 id="brandName">白璎</h1><p>长期记忆 AI 伙伴</p></div>
    </div>
    <nav id="nav">
      <button data-page="overview" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>概览</button>
      <button data-page="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今天</button>
      <button data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>设置</button>
      <button data-page="persona">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg><span id="navPersona">白璎</span></button>
      <button data-page="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5"/></svg>人物与记忆</button>
      <button data-page="stickers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h8l7-7V6a3 3 0 0 0-3-3h-4z"/><path d="M14 21v-4a3 3 0 0 1 3-3h4"/><circle cx="9" cy="10" r="1"/><circle cx="14" cy="10" r="1"/><path d="M8.5 14c1.5 1.3 3.5 1.3 5 0"/></svg>表情包</button>
      <button data-page="skills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 15.4 7 18.2l1.2-5.6L4 8.8l5.6-.6z"/></svg>技能</button>
      <button data-page="trpg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="12" cy="12" r="1"/></svg>跑团</button>
      <button data-page="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h11a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h7M9 12h7"/></svg>日记</button>
    </nav>
    <div class="aside-foot">设置保存后，需重启<br><code>companion qq</code> 才会生效</div>
  </aside>
  <main id="main"></main>
</div>

<div class="savebar" id="savebar">
  <span id="saveText">有 0 项未保存</span>
  <button class="btn small" id="undoBtn">撤销</button>
  <button class="btn small primary" id="saveBtn">保存</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody" class="muted"></div>
    <div class="actions">
      <button class="btn" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const main = $("#main");
const state = { page: "overview", fields: [], dirty: {}, person: null, journal: null, persona: "白璎" };

// ---------- 工具 ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("zh-CN", { year: "numeric", month: "numeric", day: "numeric" }) : "—";
const greeting = () => {
  const h = new Date().getHours();
  return h < 5 ? "夜深了" : h < 11 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
};

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch("/api/" + path, opt);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $("#toast");
  t.innerHTML = (err ? "⚠️ " : "✨ ") + esc(msg);
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast" + (err ? " err" : ""), 3200);
}

function confirmBox(title, body, okText = "确定") {
  return new Promise(resolve => {
    $("#modalTitle").textContent = title;
    $("#modalBody").innerHTML = body;
    $("#modalOk").textContent = okText;
    $("#modalBack").classList.add("show");
    const done = v => { $("#modalBack").classList.remove("show"); $("#modalOk").onclick = $("#modalCancel").onclick = null; resolve(v); };
    $("#modalOk").onclick = () => done(true);
    $("#modalCancel").onclick = () => done(false);
  });
}

// 极简 Markdown：标题、列表、引用、段落；〔出处〕显示为浅色
function md(text) {
  text = String(text || "").replace(/^---\n[\s\S]*?\n---\n/, "");
  const out = []; let list = false;
  const inline = s => esc(s).replace(/〔([^〕]*)〕/g, '<span class="src">〔$1〕</span>');
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*] (.*)$/);
    if (!li && list) { out.push("</ul>"); list = false; }
    if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
    else if (line.startsWith("## ")) out.push(`<h2>${inline(line.slice(3))}</h2>`);
    else if (line.startsWith("# ")) out.push(`<h1>${inline(line.slice(2))}</h1>`);
    else if (line.startsWith(">")) out.push(`<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  // 下面没有内容的小标题，补一句“还没有”
  const filled = [];
  out.forEach((html, i) => {
    filled.push(html);
    if (html.startsWith("<h2>") && (i === out.length - 1 || out[i + 1].startsWith("<h2>")))
      filled.push('<p class="faint">还没有内容，会在之后的反思里慢慢写上。</p>');
  });
  return filled.join("") || '<p class="faint">（还是空的）</p>';
}

function setPersona(name) {
  state.persona = name || "白璎";
  $("#brandName").textContent = state.persona;
  $("#navPersona").textContent = state.persona;
  $("#brandAvatar").textContent = state.persona.slice(-1);
  document.title = state.persona + "控制台";
}

// ---------- 导航 ----------
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-page]");
  if (b) go(b.dataset.page);
});
async function go(page) {
  if (Object.keys(state.dirty).length && page !== state.page) {
    const leave = await confirmBox("有未保存的设置", "离开这个页面会丢掉还没保存的修改。", "仍然离开");
    if (!leave) return;
    state.dirty = {}; updateSavebar();
  }
  state.page = page;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.page === page));
  main.innerHTML = '<div class="empty">加载中…</div>';
  try { await pages[page](); } catch (err) { main.innerHTML = `<div class="card empty">😢 ${esc(err.message)}</div>`; }
}

const pages = {};

// ---------- 概览 ----------
pages.overview = async (refresh = false) => {
  const d = await api("overview" + (refresh ? "?refresh=1" : ""));
  setPersona(d.persona);
  const m = d.memory, fb = d.fallback;
  const backend = name => d.backends.find(b => b.name === name) || {};
  const sub = backend("subscription"), fbs = backend("fallback");
  const pct = fb.budget ? Math.min(100, fb.spent / fb.budget * 100) : 0;
  const barCls = p => p >= 100 ? "bar full" : p >= 80 ? "bar warn" : "bar";
  const windowName = mins => mins === 300 ? "5 小时窗口" : mins === 10080 ? "7 天窗口" : mins ? `${mins} 分钟窗口` : "额度窗口";
  const quotas = d.quota_windows.length ? d.quota_windows.map(w => `
      <div class="quota">
        <div class="row"><span>${windowName(w.minutes)}</span><span class="muted">已用 <b>${w.used}%</b> · ${w.resets_at ? fmtTime(w.resets_at) + " 重置" : ""}</span></div>
        <div class="${barCls(w.used)}"><i style="width:${w.used}%"></i></div>
      </div>`).join("") : '<p class="faint">暂时读不到额度信息</p>';
  main.innerHTML = `
    <div class="hero">
      <h2>${greeting()}，这里是${esc(d.persona)}的控制台</h2>
      <p>她现在记得 ${m.people} 个人、${m.facts} 条事实、${m.episodes} 段经历${m.last_sleep ? "，上次睡眠在 " + fmtTime(m.last_sleep) : "，还没有睡过觉"}。</p>
    </div>
    <div class="grid cols-2">
      <div class="card">
        <h3><span class="dot ${sub.available ? "on" : "off"}"></span>GPT 订阅
          <span style="margin-left:auto"><button class="btn small" id="refreshQuota">刷新额度</button></span></h3>
        <p class="faint" style="margin:-6px 0 12px">${esc(sub.detail || "")}</p>
        ${quotas}
      </div>
      <div class="card">
        <h3><span class="dot ${fbs.available ? "on" : "off"}"></span>DeepSeek 兜底</h3>
        <div class="quota">
          <div class="row"><span>本月花费</span><span class="muted"><b>$${fb.spent.toFixed(4)}</b> / $${fb.budget}</span></div>
          <div class="${barCls(pct)}"><i style="width:${Math.max(pct, fb.spent > 0 ? 1.5 : 0)}%"></i></div>
        </div>
        <dl class="kv">
          <dt>模型</dt><dd>${esc(fb.model || "未设置")}</dd>
          <dt>API key</dt><dd>${fb.key_set ? '<span class="chip green">已设置</span>' : '<span class="chip amber">未设置</span>'}</dd>
        </dl>
      </div>
      <div class="card">
        <h3>🧠 记忆</h3>
        <div class="stats">
          <div class="stat"><b>${m.people}</b><span>认识的人</span></div>
          <div class="stat"><b>${m.facts}</b><span>有效事实</span></div>
          <div class="stat"><b>${m.episodes}</b><span>共同经历</span></div>
          <div class="stat"><b>${m.superseded_facts}</b><span>已更新的旧事实</span></div>
        </div>
      </div>
      <div class="card">
        <h3>💬 QQ</h3>
        <dl class="kv">
          <dt>账号</dt><dd>${esc(d.qq.account || "未设置")}</dd>
          <dt>NapCat token</dt><dd>${d.qq.token_set ? '<span class="chip green">已设置</span>' : '<span class="chip amber">未设置</span>'}</dd>
          <dt>允许的群</dt><dd>${d.qq.groups} 个</dd>
          <dt>主人账号</dt><dd>${d.qq.owners} 个</dd>
        </dl>
      </div>
    </div>
    <div class="card" style="margin-top:18px;cursor:${d.latest_journal ? "pointer" : "default"}" id="latestJournal">
      <h3>📔 最近的日记</h3>
      ${d.latest_journal ? `<p style="margin:0"><span class="chip">${esc(d.latest_journal.date)}</span>
        <span class="muted" style="margin-left:8px">${esc(d.latest_journal.preview)}…</span></p>` : '<p class="faint">她还没有写过日记。每天睡眠后会写一篇。</p>'}
    </div>`;
  $("#refreshQuota").onclick = async () => { await pages.overview(true); toast("额度已刷新"); };
  if (d.latest_journal) $("#latestJournal").onclick = () => { state.journal = d.latest_journal.date; go("journal"); };
};

// ---------- 今天 ----------
const SLOT_NAMES = ["凌晨", "早上", "上午", "中午", "下午", "傍晚", "晚上", "深夜"];
const ACTIVITY_ICON = { explore: "🔎", write: "✍️", draw: "🎨", chat_owner: "💬" };
const PROACTIVE_NAME = { morning: "早安", night: "晚安", share: "分享", chat_owner: "找主人聊天" };
pages.today = async () => {
  const d = await api("today");
  const p = d.plan;
  const nowIdx = SLOT_NAMES.indexOf(d.slot);
  const mood = d.mood
    ? `<div class="mood-word">${d.mood.strength >= 0.6 ? "" : "还有一点"}${esc(d.mood.word)}</div>
       <p class="muted" style="margin:4px 0 10px">${esc(d.mood.cause || "没说原因")}</p>
       <div class="bar"><i style="width:${Math.round(d.mood.strength * 100)}%"></i></div>
       <p class="faint" style="margin:6px 0 0">强度 ${Math.round(d.mood.strength * 100)}%，会慢慢回到今天的基调${p ? "：" + esc(p.mood) : ""}</p>`
    : `<div class="mood-word">${p ? esc(p.mood) : "平平常常"}</div><p class="faint" style="margin:4px 0 0">${p ? "今天的基调，没什么起伏" : "今天还没有安排"}</p>`;
  const plan = p ? `
      <p class="muted" style="margin:-4px 0 10px">在读：<b>${esc(p.reading)}</b></p>
      <div class="slots">${SLOT_NAMES.map((name, i) => `
        <div class="slot ${i === nowIdx ? "now" : i > nowIdx ? "later" : ""}"><b>${name}${i === nowIdx ? " · 现在" : ""}</b><span>${esc(p.slots[name] || "")}</span></div>`).join("")}</div>
      ${p.small_things.length ? `<p class="muted" style="margin:12px 0 4px">今天的小事：${p.small_things.map(t => esc(t.replace(/[。；]+$/, ""))).join("；")}</p>` : ""}`
    : '<p class="faint">今天还没有安排。睡眠后（或服务运行时）会自动排好。</p>';
  const events = [
    ...d.moods.map(m => ({ ts: m.ts, icon: "💭", text: `心情：${m.word}${m.cause ? "（" + m.cause + "）" : ""}` })),
    ...d.activities.map(a => ({ ts: a.ts, icon: ACTIVITY_ICON[a.kind] || "✨", text: a.title + (a.summary ? "\n" + a.summary : "") })),
    ...d.proactive.map(x => ({ ts: x.ts, icon: "📨", text: `主动找主人（${PROACTIVE_NAME[x.kind] || x.kind}）：${x.text}` })),
  ].sort((a, b) => a.ts < b.ts ? 1 : -1);
  const timeline = events.length ? events.map(e => `
      <div class="memo"><div>${e.icon}</div><div class="body">${esc(e.text)}<div class="when">${fmtTime(e.ts)}</div></div></div>`).join("")
    : '<p class="faint">今天还没有心情变化、自己做的事或主动找主人的记录。</p>';
  const writings = d.writings.length ? d.writings.map(w => `
      <div class="memo"><div>✍️</div><div class="body"><b>${esc(w.title)}</b>\n${esc(w.text)}<div class="when">${esc(w.name)}</div></div></div>`).join("")
    : '<p class="faint">她还没有写过东西。额度充足时她可能会写一点。</p>';
  const quota = d.quota_session ? `本轮自主时间已做 ${d.quota_session.count} 件（开始时 5 小时额度已用 ${d.quota_session.start_used}%）` : "";
  main.innerHTML = `
    <div class="page-head"><div><h2>今天 · ${esc(d.date)}</h2><p>${esc(state.persona)}的 AI 版日常：安排、心情，以及她自己做的事。${esc(quota)}</p></div></div>
    <div class="grid cols-2">
      <div class="card"><h3>💭 现在的心情</h3>${mood}</div>
      <div class="card section-card" style="margin-bottom:0"><h3>📅 今天的安排</h3>${plan}</div>
      <div class="card timeline"><h3>🕰️ 今天发生的</h3>${timeline}</div>
      <div class="card timeline"><h3>✍️ 她写的东西</h3>${writings}</div>
    </div>`;
};

// ---------- 设置 ----------
const SOURCE_CHIP = { "默认": "grey", "config.toml": "grey", "本机设置": "", ".env": "amber", "环境变量": "amber" };
pages.settings = async () => {
  const d = await api("settings");
  state.fields = d.fields;
  renderSettings();
};

function renderSettings() {
  const sections = [];
  for (const f of state.fields.filter(f => !isSkillSection(f.section))) {
    let s = sections.find(x => x.name === f.section);
    if (!s) sections.push(s = { name: f.section, fields: [] });
    s.fields.push(f);
  }
  const icons = { "人格": "💜", "模型": "🤖", "记忆": "🧠", "QQ": "💬", "看图": "🖼️", "表情包": "🫧", "睡眠": "🌙",
                  "今日状态与心情": "💭", "主动找主人": "📨", "自主活动": "✨" };
  main.innerHTML = `
    <div class="page-head"><div><h2>设置</h2>
      <p>保存到本机设置（<code>config.local.toml</code>）；原本写在 <code>.env</code> 的项会改回 <code>.env</code>。密钥不会出现在这里。</p></div></div>
    ${sections.map(s => `<div class="card section-card"><h3>${icons[s.name] || "⚙️"} ${esc(s.name)}</h3>
      ${s.fields.map(fieldRow).join("")}</div>`).join("")}`;
  bindFields();
}

const isSkillSection = name => name === "技能" || name.startsWith("技能·");
const rerenderFields = () => state.page === "skills" ? renderSkills() : renderSettings();

function bindFields() {
  main.querySelectorAll("[data-path]").forEach(el => {
    const ev = el.type === "range" || el.type === "text" || el.type === "number" ? "input" : "change";
    el.addEventListener(ev, () => onFieldChange(el));
  });
  main.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => resetField(b.dataset.reset));
}

function currentValue(f) { return f.path in state.dirty ? state.dirty[f.path] : f.value; }

function fieldRow(f) {
  const v = currentValue(f);
  const locked = f.source === "环境变量";
  const dis = locked ? "disabled" : "";
  let control;
  if (f.kind === "bool") {
    control = `<label class="switch"><input type="checkbox" data-path="${f.path}" ${v ? "checked" : ""} ${dis}><span></span></label>`;
  } else if (f.kind === "select") {
    control = `<select data-path="${f.path}" ${dis}>${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  } else if (f.kind === "slider") {
    control = `<div class="slider-wrap"><input type="range" data-path="${f.path}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v ?? f.min}" ${dis}>
      <span class="slider-val" id="sv-${f.path.replaceAll(".", "-")}">${fmtSlider(f, v)}</span></div>`;
  } else if (f.kind === "number") {
    control = `<div class="num-wrap"><input type="number" data-path="${f.path}" min="${f.min ?? ""}" max="${f.max ?? ""}" step="${f.step ?? "any"}" value="${v ?? ""}" ${dis}>
      ${f.unit ? `<span class="unit">${esc(f.unit)}</span>` : ""}</div>`;
  } else if (f.kind === "list") {
    control = `<input type="text" data-path="${f.path}" value="${esc((v || []).join(", "))}" placeholder="用逗号分隔" ${dis}>`;
  } else {
    control = `<input type="text" data-path="${f.path}" value="${esc(v ?? "")}" placeholder="${esc(f.default ?? "（留空 = 默认）")}" ${dis}>`;
  }
  const chip = `<span class="chip ${SOURCE_CHIP[f.source] ?? ""}" title="${f.env_var ? "环境变量名：" + esc(f.env_var) : ""}">${esc(f.source)}</span>`;
  const reset = f.source === "本机设置" ? `<button class="link" data-reset="${f.path}">恢复默认</button>` : "";
  return `<div class="field ${f.path in state.dirty ? "dirty" : ""}" id="row-${f.path.replaceAll(".", "-")}">
      <div><div class="label">${esc(f.label)} ${chip} ${reset}</div>
        <div class="help">${esc(f.help)}${locked ? "（由系统环境变量设定，这里不能改）" : ""}</div></div>
      <div class="control">${control}</div></div>`;
}

function fmtSlider(f, v) {
  if (v === null || v === undefined) return "—";
  if (f.unit === "%") return Math.round(v) + "%";
  if (f.max <= 1) return Math.round(v * 100) + "%";
  return Number(v).toFixed(2);
}

function onFieldChange(el) {
  const f = state.fields.find(x => x.path === el.dataset.path);
  let v;
  if (f.kind === "bool") v = el.checked;
  else if (f.kind === "number" || f.kind === "slider") v = el.value === "" ? null : Number(el.value);
  else if (f.kind === "list") v = el.value.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
  else v = el.value;
  if (f.kind === "slider") $("#sv-" + f.path.replaceAll(".", "-")).textContent = fmtSlider(f, v);
  const same = JSON.stringify(v) === JSON.stringify(f.value) || (f.kind === "text" && (v || null) === (f.value || null));
  if (same) delete state.dirty[f.path]; else state.dirty[f.path] = v;
  $("#row-" + f.path.replaceAll(".", "-")).classList.toggle("dirty", f.path in state.dirty);
  updateSavebar();
}

function updateSavebar() {
  const n = Object.keys(state.dirty).length;
  $("#saveText").textContent = `有 ${n} 项未保存`;
  $("#savebar").classList.toggle("show", n > 0);
}

$("#undoBtn").onclick = () => { state.dirty = {}; updateSavebar(); rerenderFields(); };
$("#saveBtn").onclick = async () => {
  const btn = $("#saveBtn"); btn.disabled = true;
  try {
    const d = await api("settings", { changes: state.dirty });
    state.fields = d.fields; state.dirty = {}; updateSavebar(); rerenderFields();
    const persona = state.fields.find(f => f.path === "persona.name");
    if (persona) setPersona(persona.value);
    toast(`已保存到 ${d.written.join("、") || "本机设置"}，重启 companion qq 后生效`);
  } catch (err) { toast(err.message, true); }
  finally { btn.disabled = false; }
};

async function resetField(path) {
  try {
    const d = await api("settings-reset", { path });
    state.fields = d.fields; delete state.dirty[path]; updateSavebar(); rerenderFields();
    toast("已恢复默认");
  } catch (err) { toast(err.message, true); }
}

// ---------- 白璎 ----------
pages.persona = async () => {
  const d = await api("self");
  main.innerHTML = `
    <div class="page-head"><div><h2>${esc(state.persona)}</h2>
      <p>种子是她的核心性格与底线，只由你修改；自我认知和表达习惯由她每天的反思自动更新。</p></div></div>
    <div class="grid persona-grid">
      <div class="card">
        <h3>🌱 种子 <span class="chip">只由你修改</span></h3>
        <textarea class="seed" id="seedText" spellcheck="false">${esc(d.seed)}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <span class="faint">保存后会记进她的记忆仓库</span>
          <button class="btn primary" id="saveSeed">保存种子</button>
        </div>
      </div>
      <div class="grid">
        <div class="card md"><h3>🪞 自我认知 <span class="chip grey">每周反思</span></h3>${md(d.identity)}</div>
        <div class="card md"><h3>🎐 表达习惯 <span class="chip grey">表达学习</span></h3>${md(d.style)}</div>
      </div>
    </div>`;
  $("#saveSeed").onclick = async () => {
    try { await api("seed", { text: $("#seedText").value }); toast("种子已保存，下一句话起就会生效"); }
    catch (err) { toast(err.message, true); }
  };
};

// ---------- 人物与记忆 ----------
pages.people = async () => {
  const d = await api("people");
  const all = [{ id: "self", names: [state.persona + "（自己）"], facts: d.self_facts, episodes: 0, accounts: {} }, ...d.people];
  if (!state.person || !all.some(p => p.id === state.person)) state.person = (d.people[0] || all[0]).id;
  main.innerHTML = `
    <div class="page-head"><div><h2>人物与记忆</h2>
      <p>她认识的人、知道的事和一起经历过的事。不想让她记得的，可以在这里让她彻底忘掉。</p></div></div>
    <div class="people">
      <div class="plist">${all.map(p => `
        <button class="pitem ${p.id === state.person ? "active" : ""}" data-pid="${esc(p.id)}">
          <div class="pav">${esc((p.names[0] || p.id).slice(0, 1))}</div>
          <div><div>${esc(p.names.join(" / "))}</div>
            <div class="meta">${p.facts} 条事实 · ${p.episodes} 段经历${Object.entries(p.accounts).map(([k, v]) => " · " + k + " " + v.length).join("")}</div></div>
        </button>`).join("")}</div>
      <div id="personDetail"><div class="card empty">加载中…</div></div>
    </div>`;
  main.querySelectorAll(".pitem").forEach(b => b.onclick = () => {
    state.person = b.dataset.pid;
    main.querySelectorAll(".pitem").forEach(x => x.classList.toggle("active", x === b));
    loadPerson();
  });
  loadPerson();
};

const STATE_CHIP = { vivid: ["鲜活", "green"], faded: ["淡化", "amber"], compressed: ["压缩", "grey"], dormant: ["沉睡", "grey"] };
async function loadPerson() {
  const box = $("#personDetail");
  const p = await api("people/" + encodeURIComponent(state.person));
  box.innerHTML = `
    ${p.profile ? `<div class="card md" style="margin-bottom:18px">${md(p.profile)}</div>` : ""}
    <div class="card" style="margin-bottom:18px"><h3>📌 知道的事 <span class="chip grey">${p.facts.length}</span></h3>
      ${p.facts.length ? p.facts.map(f => `
        <div class="memo"><div class="body">${esc(f.statement)}
          <div class="when">${fmtDate(f.since)} 得知 ${f.pinned ? '<span class="chip">📌 钉住</span>' : ""}
            ${f.confidence < 0.7 ? '<span class="chip amber">不太确定</span>' : ""}</div></div>
          <button class="btn small danger" data-forget="fact:${f.id}">忘掉</button></div>`).join("") : '<p class="faint">还没有</p>'}
    </div>
    <div class="card"><h3>🕰️ 一起经历的事 <span class="chip grey">${p.episodes.length}</span></h3>
      ${p.episodes.length ? p.episodes.map(e => `
        <div class="memo"><div class="body">${esc(e.summary)}
          <div class="when">${fmtTime(e.when)} <span class="chip ${STATE_CHIP[e.state][1]}">${STATE_CHIP[e.state][0]}</span></div></div>
          <button class="btn small danger" data-forget="episode:${e.id}">忘掉</button></div>`).join("") : '<p class="faint">还没有</p>'}
    </div>`;
  box.querySelectorAll("[data-forget]").forEach(b => b.onclick = async () => {
    const [kind, id] = b.dataset.forget.split(":");
    const text = b.closest(".memo").querySelector(".body").firstChild.textContent.trim();
    const ok = await confirmBox("让她彻底忘掉这条记忆？",
      `<p>「${esc(text)}」</p><p class="faint">会同时删除这条记忆依据的原始聊天记录，以及引用同一段对话的其他记忆。删除后无法恢复。</p>`, "忘掉");
    if (!ok) return;
    try {
      const r = await api("forget", { kind, id });
      toast(`已经忘掉了 ${r.memories} 条记忆、${r.messages} 条聊天记录`);
      pages.people();
    } catch (err) { toast(err.message, true); }
  });
}

// ---------- 表情包 ----------
pages.stickers = async () => {
  const d = await api("stickers");
  state.stickerFilter = state.stickerFilter && d.emotions.includes(state.stickerFilter) ? state.stickerFilter : null;
  const shown = d.stickers.filter(s => !state.stickerFilter || s.emotion === state.stickerFilter);
  main.innerHTML = `
    <div class="page-head"><div><h2>表情包</h2>
      <p>${esc(state.persona)}从群聊和私聊里收藏的表情，两边共用。共 ${d.stickers.length} 张 / 上限 ${d.capacity} 张。</p></div></div>
    ${d.stickers.length ? `
    <div class="filters">
      <button class="${state.stickerFilter ? "" : "on"}" data-emotion="">全部</button>
      ${d.emotions.map(e => `<button class="${e === state.stickerFilter ? "on" : ""}" data-emotion="${esc(e)}">${esc(e)}</button>`).join("")}
    </div>
    <div class="sticker-grid">${shown.map(s => `
      <div class="sticker">
        <button class="btn small danger del" data-digest="${esc(s.digest)}">删除</button>
        <div class="pic"><img src="/api/sticker-image/${esc(s.digest)}" alt="${esc(s.description)}" loading="lazy"></div>
        <div class="info">
          <span class="chip">${esc(s.emotion)}</span>
          <div class="desc" title="${esc(s.description)}">${esc(s.description)}</div>
          <div class="counts">见过 ${s.seen} 次 · 发过 ${s.used} 次${s.from.length ? " · 来自 " + esc(s.from.slice(0, 2).join("、")) : ""}</div>
        </div>
      </div>`).join("")}</div>` : `
    <div class="card empty">🫧 还没有收藏任何表情包。<br>群友发表情、而她正好在看图时（@她、私聊、或她刚说完话的一分钟内），她会把合适的收藏起来。</div>`}`;
  main.querySelectorAll("[data-emotion]").forEach(b => b.onclick = () => { state.stickerFilter = b.dataset.emotion || null; pages.stickers(); });
  main.querySelectorAll("[data-digest]").forEach(b => b.onclick = async () => {
    const ok = await confirmBox("删除这张表情包？", "删除后她就不会再用它了，图片也会一起删掉。", "删除");
    if (!ok) return;
    try { await api("sticker-delete", { digest: b.dataset.digest }); toast("已删除"); pages.stickers(); }
    catch (err) { toast(err.message, true); }
  });
};

// ---------- 技能 ----------
pages.skills = async () => {
  const [s, d] = await Promise.all([api("settings"), api("skills")]);
  state.fields = s.fields; state.skills = d;
  renderSkills();
};

function renderSkills() {
  const d = state.skills;
  const fieldsOf = section => state.fields.filter(f => f.section === section);
  const general = fieldsOf("技能");
  const master = general.find(f => f.path === "skills.enabled");
  const on = master ? currentValue(master) : true;
  const cards = d.skills.map(k => `
    <div class="card section-card">
      <h3>${esc(k.label)} ${k.status ? `<span class="chip grey">${esc(k.status)}</span>` : ""}</h3>
      <div class="help" style="margin:-4px 0 10px">${k.usage.map(u => esc(u)).join("<br>")}</div>
      ${fieldsOf("技能·" + k.label).map(fieldRow).join("")}
    </div>`).join("");
  const fmtRow = r => `<div class="memo"><div class="body">${esc(r.arg)}
      <div class="when">${fmtTime(r.ts)} · ${esc((d.skills.find(k => k.name === r.skill) || {}).label || r.skill)} · ${r.seconds} 秒
        ${r.ok ? "" : '<span class="chip amber">失败</span>'}</div></div></div>`;
  main.innerHTML = `
    <div class="page-head"><div><h2>技能</h2>
      <p>${esc(state.persona)}聊天时可以用的能力：她在回复里写一个标记，程序执行后把结果交回给她，她再接着说。${on ? "" : "<b>现在总开关是关着的。</b>"}</p></div></div>
    <div class="card section-card"><h3>🧩 通用</h3>${general.map(fieldRow).join("")}</div>
    <div style="margin-top:18px" class="grid">${cards || '<div class="card empty">🧩 还没有装上任何技能。</div>'}</div>
    <div class="card" style="margin-top:18px"><h3>🕘 最近用过 <span class="chip grey">${d.recent.length}</span></h3>
      ${d.recent.length ? d.recent.map(fmtRow).join("") : '<p class="faint">还没用过技能</p>'}</div>`;
  bindFields();
}

// ---------- 日记 ----------
pages.trpg = async () => {
  const d = await api("trpg");
  const selected = d.campaigns.find(c => c.id === state.trpgId) || d.campaigns[0];
  state.trpgId = selected?.id;
  let current = null;
  if (selected) current = await api("trpg", {campaign:selected.id, as_kp:!!state.trpgKP, operation:"状态"});
  const v = current?.data || {}, full = v.state || {}, cards = full.characters || v.characters || {};
  const status = {draft:"准备",active:"进行中",paused:"暂停",closed:"结束"};
  const metric = d.metrics.find(m=>m.day===d.today) || {};
  const opt = (value,label) => `<option value="${esc(value)}">${esc(label)}</option>`;
  main.innerHTML = `<div class="page-head"><div><h2>跑团</h2><p class="muted">角色和进度由程序保存；只在需要描写时调用模型。控制台操作不会自动向QQ发消息。</p></div></div>
    <div class="panel"><div class="actions"><select id="trpgSelect">${d.campaigns.map(c=>`<option value="${esc(c.id)}" ${c.id===selected?.id?"selected":""}>${esc(c.name)} · ${esc(status[c.status]||c.status)}</option>`).join("")}</select>
      <label><input id="trpgKP" type="checkbox" ${state.trpgKP?"checked":""}> 以本团KP身份管理（可见秘密）</label><button class="btn" id="trpgRefresh">刷新</button></div>
      <details><summary>建立新团</summary><input id="newTrpgName" placeholder="团名"><select id="newTrpgChannel">${d.channels.map(g=>opt("group:"+g,"群 "+g)).join("")}</select><button class="btn" id="newTrpg">建立</button></details>
    </div>
    ${selected?`<div class="stats"><div class="stat"><div class="label">状态</div><strong>${esc(status[selected.status])} · v${selected.version}</strong></div><div class="stat"><div class="label">叙事时间</div><strong>第${esc(full.day||v.day)}日 · ${esc(full.minutes??v.minutes)}分钟</strong></div><div class="stat"><div class="label">今日模型请求</div><strong>${metric.calls??0}</strong></div><div class="stat"><div class="label">今日送入字符</div><strong>${metric.input_chars??0}</strong></div></div>
    <div class="panel"><h3>进度</h3><p>${esc(full.scenes?.[full.scene]?.public||v.description||"尚无公开场景")}</p>
      <div class="actions">${["开团","暂停","续团","结束","确认恢复"].map(op=>`<button class="btn" data-trpg-op="${op}">${op}</button>`).join("")}<button class="btn" id="trpgReport">下载当前可见战报</button><button class="btn" id="trpgCardExport">下载卡与状态</button></div>
      <div class="muted">输入token ${metric.input_tokens??"未报告"} · 输出token ${metric.output_tokens??"未报告"} · 缓存token ${metric.cached_tokens??"未报告"}。服务端未报告时不会写成0；订阅额度不等于固定轮数。</div>
      ${full.needs_confirmation?'<p>这是恢复草案；核对角色、所在位置、物品与疑点后再确认，确认本身不会自动续团。</p>':""}
    </div>
    <div class="panel"><h3>白璎主持</h3><p>${(full.ai_kp?.enabled||v.ai_host)?"本团已启用独立AI主持。玩家直接说：继续跑团 → 确认继续；随后描述行动，按提示说确认投骰、闪避或反击。":"本团尚未启用AI主持，仍按管理员准备的团务流程运行。"}</p>
      ${state.trpgKP?`<p class="muted">专用主持只读取已授权的本团来源；公开叙事看不到KP原文。授权撤销后不再发起私有模型调用；修改准备资料后须重新授权。</p><label><input id="trpgPrivateConsent" type="checkbox"> 我允许当前订阅模型在本团专用主持上下文中读取已登记来源和当前审核模组</label><button class="btn" id="trpgEnableHost">授权并启用</button><button class="btn" id="trpgDisableHost">撤销AI主持</button>`:""}</div>
    <div class="panel"><h3>人物卡</h3>${Object.entries(cards).map(([id,c])=>`<div class="field"><div>${esc(c.name)} ${c.npc?"（NPC）":""}</div><div>${c.HP!==undefined?`HP ${c.HP}/${c.HP_MAX} · SAN ${c.SAN}`:""} ${esc((c.conditions||[]).join("、"))}<small class="muted"> ${esc(id)}</small></div></div>`).join("")||"尚未录入人物"}</div>
    ${state.trpgKP?`<div class="panel"><h3>KP管理</h3><details><summary>成员登记</summary><input id="trpgMember" placeholder="QQ号"><select id="trpgRole">${opt("player","玩家")+opt("kp","KP")+opt("observer","旁观者")}</select><button class="btn" id="trpgAddMember">保存成员</button></details>
      <details><summary>录入或修改角色卡</summary><input id="trpgPerson" placeholder="固定人物ID（成员登记后可在下方状态查看）"><input id="trpgCardName" placeholder="角色名"><label><input type="checkbox" id="trpgNPC"> NPC</label>
      <p class="muted">新卡可导入属性、技能和物品；修改现有卡需暂停并填写原因。程序会核验数值，不覆盖骰点。</p><textarea id="trpgCard" rows="7" style="width:100%" placeholder='{"CON":55,"DEX":50,"HP_MAX":10,"HP":5,"SAN":64,"skills":{"侦查":60},"items":{"绷带":1}}'></textarea><input id="trpgCardReason" placeholder="修改理由"><select id="trpgCardMode">${opt("建卡","新建")+opt("改卡","修改")}</select><button class="btn" id="trpgSaveCard">保存角色</button></details>
      <details><summary>配置场景与行动</summary><input id="trpgSceneId" placeholder="场景编号"><input id="trpgSceneTitle" placeholder="标题"><textarea id="trpgScenePublic" rows="3" style="width:100%" placeholder="玩家可观察到的环境"></textarea><textarea id="trpgSceneActions" rows="6" style="width:100%" placeholder='行动模板列表；用法见项目 docs/trpg-system.md'></textarea><button class="btn" id="trpgSaveScene">保存场景</button>
      <p class="muted">自由探索使用场景行动和线索条件，不按房间编号强制前进。尚无模板的行动会提出澄清，不擅自改状态。</p></details>
      <details><summary>宣告正式检定</summary><input id="trpgCheckActor" placeholder="玩家固定人物ID"><input id="trpgCheckSkill" placeholder="技能，如侦查/斗殴/SAN"><select id="trpgCheckKind">${["skill","sanity","combat","opposed","heal","growth","dying"].map((x,i)=>opt(x,["技能","理智","战斗","对抗","治疗","成长","濒死"][i])).join("")}</select><input id="trpgGoal" placeholder="要达成的目标"><input id="trpgRisk" placeholder="失败风险（投骰前公开）"><textarea id="trpgCheckExtra" rows="4" style="width:100%" placeholder='高级选项，如 {"difficulty":"困难","bonus":1}；战斗需先设定参战者及对手'></textarea><button class="btn" id="trpgRequest">宣告检定</button></details>
      <details><summary>资料入库和按页检索</summary><input id="trpgDocPath" placeholder="本机PDF/MD路径"><select id="trpgVisibility">${opt("kp","仅KP")+opt("public","公开规则")+opt("party","参团者私聊可见")}</select><button class="btn" id="trpgImport">入库</button><input id="trpgQuery" placeholder="关键词"><button class="btn" id="trpgSearch">检索当前权限资料</button></details>
      <p class="muted">本地模组导入：高级操作选“模组草案”，粘贴 scenes / facts / notes 对象；审查完整状态里的 module_draft 后执行“采纳模组”。KP资料不会发给公开叙事模型。</p><details><summary>高级操作与完整状态</summary><select id="trpgAdvancedOp">${["状态","转场","事实","物品","战斗","结束战斗","下一位","状态裁定","模组草案","采纳模组","下一日","推进时间","房规","裁定","回滚"].map(x=>opt(x,x)).join("")}</select><textarea id="trpgAdvancedArgs" rows="10" style="width:100%" placeholder="操作参数对象"></textarea><button class="btn" id="trpgAdvanced">执行</button><pre style="white-space:pre-wrap;max-height:420px;overflow:auto">${esc(JSON.stringify(v,null,2))}</pre></details>
    </div>`:""}
    <div class="panel"><h3>场景关系</h3><div id="trpgGraph"></div></div>`:"<div class='panel'>还没有团。可由主人在QQ里发 /团 创建 团名，或在上方建立。</div>"}
    <div class="panel"><h3>操作结果</h3><pre id="trpgResult" style="white-space:pre-wrap;max-height:420px;overflow:auto"></pre></div>`;
  const invoke = async (operation,args={}) => {
    try { const r=await api("trpg",{campaign:state.trpgId,as_kp:!!state.trpgKP,operation,args,request_id:crypto.randomUUID()}); $("#trpgResult").textContent=r.text; toast("已处理"); return r; }
    catch(e){ $("#trpgResult").textContent=e.message; toast(e.message,true); }
  };
  const obj = id => JSON.parse($(id).value.trim()||"{}");
  const bind = (id,fn) => { const e=$(id); if(e) e.onclick=async()=>{try{await fn();}catch(x){toast(x.message,true);}}; };
  $("#trpgSelect").onchange = async e=>{state.trpgId=e.target.value;await pages.trpg();};
  $("#trpgKP").onchange = async e=>{state.trpgKP=e.target.checked;await pages.trpg();};
  bind("#trpgRefresh",()=>pages.trpg());
  bind("#newTrpg",async()=>{const r=await api("trpg",{operation:"创建",channel:$("#newTrpgChannel").value,args:{name:$("#newTrpgName").value}});state.trpgId=r.campaign;state.trpgKP=true;await pages.trpg();});
  main.querySelectorAll("[data-trpg-op]").forEach(b=>b.onclick=()=>invoke(b.dataset.trpgOp));
  bind("#trpgAddMember",()=>invoke("成员",{person:$("#trpgMember").value,role:$("#trpgRole").value}));
  bind("#trpgSaveCard",()=>invoke($("#trpgNPC").checked?"NPC":$("#trpgCardMode").value,{person:$("#trpgPerson").value,name:$("#trpgCardName").value,reason:$("#trpgCardReason").value,card:obj("#trpgCard")}));
  bind("#trpgSaveScene",()=>invoke("场景",{scene:{id:$("#trpgSceneId").value,title:$("#trpgSceneTitle").value,public:$("#trpgScenePublic").value,actions:JSON.parse($("#trpgSceneActions").value||"[]")}}));
  bind("#trpgRequest",()=>invoke("检定",{...obj("#trpgCheckExtra"),actor:$("#trpgCheckActor").value,skill:$("#trpgCheckSkill").value,kind:$("#trpgCheckKind").value,reason:$("#trpgGoal").value,risk:$("#trpgRisk").value}));
  bind("#trpgImport",()=>invoke("导入资料",{path:$("#trpgDocPath").value,visibility:$("#trpgVisibility").value}));
  bind("#trpgSearch",()=>invoke("检索",{query:$("#trpgQuery").value,private:true}));
  bind("#trpgDisableHost",()=>invoke("主持授权",{enabled:false}));
  bind("#trpgEnableHost",()=>{if(!$("#trpgPrivateConsent").checked){toast("请先明确勾选本团私有资料授权",true);return;}const sources=full.ai_kp?.sources||[];if(!sources.length){toast("请先完成来源锁定的模组准备和登记",true);return;}return invoke("主持授权",{enabled:true,allow_private_model:true,sources,consent:"本机控制台勾选同意当前订阅模型读取本团已登记KP来源及审核模组"});});
  bind("#trpgAdvanced",()=>invoke($("#trpgAdvancedOp").value,obj("#trpgAdvancedArgs")));
  const download=(name,value)=>{const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);};
  bind("#trpgCardExport",()=>download("团状态-"+state.trpgId+".json",v));
  bind("#trpgReport",async()=>{const r=await invoke("战报",{private:!!state.trpgKP});if(r)download("战报-"+state.trpgId+".json",r.data);});
  const scenes = full.scenes || (v.scene?{[v.scene]:{title:v.scene,actions:[]}}:{});
  const ids=Object.keys(scenes).slice(0,40), nodes=ids.map((id,i)=>({id,x:90+(i%4)*180,y:35+Math.floor(i/4)*85}));
  const edges=[];nodes.forEach(n=>(scenes[n.id].actions||[]).forEach(a=>(a.success||[]).filter(e=>e.type==="scene").forEach(e=>{const t=nodes.find(x=>x.id===e.name);if(t)edges.push(`<line x1="${n.x}" y1="${n.y}" x2="${t.x}" y2="${t.y}" stroke="#c4abfc"/>`);}))); 
  if($("#trpgGraph"))$("#trpgGraph").innerHTML=`<svg viewBox="0 0 760 ${Math.max(100,Math.ceil(nodes.length/4)*85)}" role="img" aria-label="当前权限可见的场景关系">${edges.join("")}${nodes.map(n=>`<rect x="${n.x-70}" y="${n.y-18}" width="140" height="36" rx="9" fill="${n.id===(full.scene||v.scene)?"#ede5ff":"#f6f2ff"}"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="12">${esc(scenes[n.id].title||n.id)}</text>`).join("")}</svg>`;
};

pages.journal = async () => {
  const d = await api("journal");
  if (!d.entries.length) {
    main.innerHTML = `<div class="page-head"><div><h2>日记</h2></div></div>
      <div class="card empty">📔 她还没有写过日记。<br>每天睡眠（默认凌晨 4 点后）会把当天的经历写成一篇。</div>`;
    return;
  }
  if (!state.journal || !d.entries.some(e => e.date === state.journal)) state.journal = d.entries[0].date;
  main.innerHTML = `
    <div class="page-head"><div><h2>日记</h2><p>${esc(state.persona)}每天睡前写下的日记。</p></div></div>
    <div class="journal">
      <div class="card" style="padding:10px">${d.entries.map(e => `
        <div class="jitem ${e.date === state.journal ? "active" : ""}" data-date="${esc(e.date)}"><b>${esc(e.date)}</b><span>${esc(e.preview)}</span></div>`).join("")}</div>
      <div id="paper" class="paper"></div>
    </div>`;
  main.querySelectorAll(".jitem").forEach(el => el.onclick = () => {
    state.journal = el.dataset.date;
    main.querySelectorAll(".jitem").forEach(x => x.classList.toggle("active", x === el));
    loadJournal();
  });
  loadJournal();
};
async function loadJournal() {
  const j = await api("journal/" + state.journal);
  $("#paper").innerHTML = `<h3>${esc(j.date)}</h3>${esc(j.text).replace(/\n/g, "<br>")}`;
}

go("overview");
