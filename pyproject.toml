[project]
name = "companion"
version = "0.1.0"
description = "长期记忆 AI 伙伴：本地记忆核心 + 可替换的模型与身体"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
companion = "companion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
